<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The stream house — ThreeOhFive Studios</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#070f14; overflow:hidden;
    font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#cfe0dd; -webkit-font-smoothing:antialiased; }
  canvas{ display:block; width:100%; height:100%; }
  /* the caption sits in the frame rather than over it — this is one picture,
     and a panel of chrome on top of it would be the loudest thing in it */
  .plate{ position:fixed; left:clamp(18px,3vw,42px); bottom:clamp(18px,3vw,38px);
    max-width:min(38ch,62vw); pointer-events:none; z-index:3;
    text-shadow:0 1px 22px rgba(3,8,10,.95); }
  .plate b{ display:block; font-size:11px; font-weight:500; letter-spacing:.22em;
    text-transform:uppercase; color:#9fbdb4; margin-bottom:8px; }
  .plate p{ margin:0; font-size:clamp(13px,1.05vw,15px); line-height:1.62; color:#dcece7; }
  .plate a{ color:#ffc98a; text-decoration:none; border-bottom:1px solid rgba(255,201,138,.35); pointer-events:auto; }
  .pre{ position:fixed; inset:0; display:grid; place-items:center; background:#070f14;
    z-index:9; transition:opacity .7s ease; }
  .pre.gone{ opacity:0; pointer-events:none; }
  .pre i{ font-style:normal; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:#7f9d97; }
  @media (max-width:640px){ .plate{ max-width:78vw; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="plate">
  <b>The stream house</b>
  <p>A forest retreat, after the rain. <a href="/portfolio/">Portfolio ↗</a></p>
</div>
<div class="pre" id="pre"><i>Growing the garden</i></div>

<script src="assets/three.min.js"></script>
<script>
/* =====================================================================
   A study, and a second scene for this site: a glass house on a rock
   shelf over a stream, at night, in the rain.

   Same rule as the portfolio it sits beside — everything visible is
   generated at load, so there is nothing to download but the geometry
   code and three.js. That constraint decides most of what follows. It is
   why the boulders are displaced icosahedra with the moss painted into
   their vertex colours rather than a texture, why the water is a shader
   rather than a normal map, and why the foliage is a handful of canvas
   sheets rather than leaf cards.
   ===================================================================== */
(function () {
'use strict';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
const LOW = new URLSearchParams(location.search).get('q') === 'low' || COARSE || (navigator.hardwareConcurrency || 8) <= 4;

/* deterministic everything: the scene must come up identical every load,
   because a "randomly generated" garden that reshuffles on refresh reads as
   a screensaver rather than as a place */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function cvs(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* value noise, 3d, cheap. Used for rock displacement and for deciding where
   moss sits — both want the same lumps at different frequencies. */
function noise3(seed) {
  const p = new Uint8Array(512), r = mulberry32(seed);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const f = t => t * t * (3 - 2 * t);
  const grad = (h, x, y, z) => {
    const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  };
  return (x, y, z) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = f(x), v = f(y), w = f(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
    const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return lerp(
      lerp(lerp(grad(p[AA] & 15, x, y, z), grad(p[BA] & 15, x - 1, y, z), u),
           lerp(grad(p[AB] & 15, x, y - 1, z), grad(p[BB] & 15, x - 1, y - 1, z), u), v),
      lerp(lerp(grad(p[AA + 1] & 15, x, y, z - 1), grad(p[BA + 1] & 15, x - 1, y, z - 1), u),
           lerp(grad(p[AB + 1] & 15, x, y - 1, z - 1), grad(p[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
  };
}

/* ================================================================= palette
   Pulled off the reference and then held to: a blue-green night with exactly
   one warm hue in it. The whole picture works because the only warm light in
   frame is coming from somewhere a person would be, so every warm pixel reads
   as habitation and everything else reads as weather. Adding a second warm
   source anywhere would cost more than it gave. */
/* Every one of these came down after the first render. Lit by an ambient, a
   hemisphere and a key, a mid-grey albedo lands near white — the boulders came
   back as polystyrene and took the moss with them, because a green lerped into
   a blown-out grey is a slightly green blown-out grey. The rule that held: pick
   the colour you want to *see*, then divide it by the light you are adding. */
const PAL = {
  night:  0x0d2029,
  fog:    0x14313a,
  rockLo: 0x1d2a31,
  rockHi: 0x7c8b92,
  moss:   0x4f9440,
  mossHi: 0x8ac95f,
  leaf:   0x2f7a4e,
  leafHi: 0x8fd982,
  water:  0x0e2830,
  warm:   0xffb257,
  warmHi: 0xffe0b0,
  glass:  0x1b3742
};

let renderer, scene, camera, W = 1, H = 1;
const T = { value: 0 };
const WORLD = { lanterns: [], glows: [] };

function vpW() { return innerWidth; }
function vpH() { return innerHeight; }

function tx(canvasEl, o) {
  o = o || {};
  const t = new THREE.CanvasTexture(canvasEl);
  t.wrapS = t.wrapT = o.wrap || THREE.ClampToEdgeWrapping;
  if (o.repeat) t.repeat.set(o.repeat[0], o.repeat[1]);
  t.anisotropy = Math.min(o.aniso || 8, renderer ? renderer.capabilities.getMaxAnisotropy() : 8);
  if (o.srgb !== false) t.encoding = THREE.sRGBEncoding;
  t.needsUpdate = true;
  return t;
}

/* ============================================================== 1 · sheets
   The cutout sheets are all the same idea: draw the plant into a canvas with
   a transparent background, hang it on a plane, and let alphaTest do the
   silhouette. It costs one draw call for a bush that would otherwise be a
   thousand leaves, and at this scale the eye cannot tell. */

/* Every cutout sheet in this scene is a drawing on a plane, and a drawing
   that runs to the edge of its canvas ends on a straight line wherever the
   plane stops. On the small plants that is hidden by the next clump; on the
   backdrop forest, which is sixty metres wide and has trunks running off all
   four sides, it was a visible rectangle of slightly different tone sitting
   across the middle of the picture. Feathering the alpha at the border lets
   each sheet dissolve into what is behind it instead of being cut out of it.
   Destination-out is safe on these: they are alpha cutouts, so alpha is what
   the material actually reads. */
function feather(c, opt) {
  opt = opt || {};
  const x = c.getContext('2d'), W = c.width, H = c.height;
  const mx = (opt.x === undefined ? .14 : opt.x) * W;
  const my = (opt.y === undefined ? .14 : opt.y) * H;
  x.globalCompositeOperation = 'destination-out';
  const band = (g, px, py, pw, ph) => { x.fillStyle = g; x.fillRect(px, py, pw, ph); };
  let g = x.createLinearGradient(0, 0, mx, 0);
  g.addColorStop(0, 'rgb(0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  band(g, 0, 0, mx, H);
  g = x.createLinearGradient(W, 0, W - mx, 0);
  g.addColorStop(0, 'rgb(0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  band(g, W - mx, 0, mx, H);
  if (opt.top !== false) {
    g = x.createLinearGradient(0, 0, 0, my);
    g.addColorStop(0, 'rgb(0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    band(g, 0, 0, W, my);
  }
  /* the bottom edge is usually where the plant is rooted and the ground is
     right there, so it gets none unless asked */
  if (opt.bottom) {
    g = x.createLinearGradient(0, H, 0, H - my);
    g.addColorStop(0, 'rgb(0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    band(g, 0, H - my, W, my);
  }
  x.globalCompositeOperation = 'source-over';
  return c;
}

/* a soft radial, for every glow in the scene */
function texGlow(inner, outer) {
  const S = 128, c = cvs(S, S), x = c.getContext('2d');
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, inner);
  g.addColorStop(.18, inner.replace(/[\d.]+\)$/, '.55)'));
  g.addColorStop(.46, outer);
  g.addColorStop(1, outer.replace(/[\d.]+\)$/, '0)'));
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  return c;
}

/* The broadleaf bush that does most of the greening. The reference is full of
   round, slightly cupped leaves catching a rim of light along one edge — that
   rim is the whole read, and it is why these are drawn as a fill plus a single
   bright arc rather than as a gradient. A gradient gives you a leaf-shaped
   blob; the arc gives you a leaf. */
function texLeafBush(seed, opt) {
  opt = opt || {};
  const W = opt.w || 768, H = opt.h || 640;
  const c = cvs(W, H), x = c.getContext('2d');
  const rnd = mulberry32(seed);
  const stems = opt.stems || 9;
  /* Leaf size, as a multiplier. The same generator draws the big-leaved plant
     at the water's edge and the wiry small-leaved shrub that fills the top
     corners of the reference — they are the same plant at a quarter scale with
     three times the stems, and drawing them as one thing means the leaf shape,
     the rim light and the midrib are all consistent between them, which is why
     they read as two species in one garden rather than as two clip-art sets. */
  const LS = opt.leaf || 1;

  const leaf = (px, py, len, ang, lit) => {
    x.save(); x.translate(px, py); x.rotate(ang);
    const w = len * .72;
    const g = x.createLinearGradient(0, -w * .5, len, w * .4);
    const a = Math.round(26 + lit * 40), b = Math.round(74 + lit * 96), d = Math.round(44 + lit * 44);
    g.addColorStop(0, 'rgb(' + a + ',' + b + ',' + d + ')');
    g.addColorStop(1, 'rgb(' + Math.round(a * .45) + ',' + Math.round(b * .5) + ',' + Math.round(d * .5) + ')');
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(0, 0);
    x.quadraticCurveTo(len * .40, -w * .62, len, 0);
    x.quadraticCurveTo(len * .40,  w * .62, 0, 0);
    x.fill();
    /* the rim. Only on the upper edge, and only on some of them — a bush where
       every leaf is rim-lit reads as plastic */
    if (lit > .42) {
      x.strokeStyle = 'rgba(' + Math.round(150 + lit * 105) + ',' + Math.round(216 + lit * 39) + ',' + Math.round(140 + lit * 70) + ',' + (.30 + lit * .5).toFixed(2) + ')';
      x.lineWidth = Math.max(1, len * .055);
      x.beginPath();
      x.moveTo(len * .06, -w * .04);
      x.quadraticCurveTo(len * .40, -w * .58, len * .96, -w * .02);
      x.stroke();
    }
    /* midrib */
    x.strokeStyle = 'rgba(14,32,20,.42)'; x.lineWidth = Math.max(.7, len * .03);
    x.beginPath(); x.moveTo(len * .06, 0); x.lineTo(len * .88, 0); x.stroke();
    x.restore();
  };

  for (let s = 0; s < stems; s++) {
    const bx = (s + .5) / stems * W + (rnd() - .5) * (W / stems) * 1.4;
    const by = H * (1.02 - rnd() * .05);
    const reach = H * (.40 + rnd() * .48);
    const lean = (rnd() - .5) * 1.5 + (bx / W - .5) * 1.1;
    const steps = 14;
    let px = bx, py = by, prevx = bx, prevy = by;
    x.strokeStyle = 'rgba(30,58,34,.9)'; x.lineCap = 'round';
    for (let i = 1; i <= steps; i++) {
      const u = i / steps;
      const ang = -Math.PI / 2 + lean * u * u;
      px += Math.cos(ang) * (reach / steps);
      py += Math.sin(ang) * (reach / steps);
      x.lineWidth = (1 - u) * 4.4 + .9;
      x.beginPath(); x.moveTo(prevx, prevy); x.lineTo(px, py); x.stroke();
      /* leaves in pairs, biggest at mid-height where the light gets in */
      if (i > 2) {
        const swell = Math.sin(Math.min(1, u * 1.15) * Math.PI);
        const len = (26 + swell * 62 + rnd() * 16) * LS;
        for (const side of [-1, 1]) {
          if (rnd() < .16) continue;
          leaf(px, py, len * (.78 + rnd() * .44),
               ang + side * (.72 + rnd() * .55) + (rnd() - .5) * .3, rnd());
        }
      }
      prevx = px; prevy = py;
    }
    /* A few pale buds at the tips. The reference has them and they are doing
       more than their size suggests: they are the only thing in the greenery
       that is not green, so the eye reads the bank as a planting rather than
       as one shrub repeated. Sparse on purpose — every stem carrying them
       would be a flowerbed. */
    if (rnd() < .55) {
      for (let b = 0, n = 1 + (rnd() * 3 | 0); b < n; b++) {
        const bxp = px + (rnd() - .5) * 40, byp = py + (rnd() - .5) * 46;
        const rr = 2.6 + rnd() * 3.4;
        const gg = x.createRadialGradient(bxp - rr * .3, byp - rr * .3, .5, bxp, byp, rr);
        gg.addColorStop(0, 'rgba(246,244,206,.95)');
        gg.addColorStop(.6, 'rgba(206,214,140,.62)');
        gg.addColorStop(1, 'rgba(150,170,96,0)');
        x.fillStyle = gg;
        x.beginPath(); x.arc(bxp, byp, rr, 0, TAU); x.fill();
      }
    }
  }
  return c;
}

/* Ferns and strap leaves, for the water's edge. Narrower than the bush and
   drawn as blades rather than lobes, because the reference has both and a
   bank made only of round leaves reads as one plant repeated. */
function texBlades(seed, opt) {
  opt = opt || {};
  const W = opt.w || 640, H = opt.h || 640;
  const c = cvs(W, H), x = c.getContext('2d');
  const rnd = mulberry32(seed);
  const n = opt.blades || 46;
  for (let i = 0; i < n; i++) {
    const bx = rnd() * W, by = H * (1.02 - rnd() * .04);
    const h = H * (.34 + rnd() * .58);
    const bend = (rnd() - .5) * W * .30;
    const wdt = 3 + rnd() * 7;
    const lit = rnd();
    const g = x.createLinearGradient(bx, by, bx + bend, by - h);
    g.addColorStop(0, 'rgb(18,44,30)');
    g.addColorStop(1, 'rgb(' + Math.round(56 + lit * 108) + ',' + Math.round(120 + lit * 118) + ',' + Math.round(58 + lit * 60) + ')');
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(bx - wdt, by);
    x.quadraticCurveTo(bx + bend * .3 - wdt * .5, by - h * .58, bx + bend, by - h);
    x.quadraticCurveTo(bx + bend * .3 + wdt * .6, by - h * .56, bx + wdt, by);
    x.closePath(); x.fill();
  }
  return c;
}

/* A fern. The bush and the blades are both simple shapes — a lobe and a
   taper — and a bank made of nothing else reads as one plant at four sizes
   however many clumps you place. A frond is the third silhouette: an arc with
   structure hanging off it, which is a thing neither of the others can do. */
function texFern(seed, opt) {
  opt = opt || {};
  const W = opt.w || 768, H = opt.h || 640;
  const c = cvs(W, H), x = c.getContext('2d');
  const rnd = mulberry32(seed);
  const fronds = opt.fronds || 8;
  const pinna = (len, wide, lit) => {
    const g = x.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, 'rgb(' + Math.round(22 + lit * 26) + ',' + Math.round(58 + lit * 54) + ',' + Math.round(32 + lit * 28) + ')');
    g.addColorStop(1, 'rgb(' + Math.round(64 + lit * 94) + ',' + Math.round(126 + lit * 104) + ',' + Math.round(58 + lit * 56) + ')');
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(0, 0);
    x.quadraticCurveTo(len * .44, -wide, len, -wide * .18);
    x.quadraticCurveTo(len * .50, wide * .54, 0, 0);
    x.fill();
  };
  for (let f = 0; f < fronds; f++) {
    const bx = (f + .5) / fronds * W + (rnd() - .5) * (W / fronds) * 1.5;
    const by = H * (1.02 - rnd() * .05);
    const reach = H * (.44 + rnd() * .46);
    const lean = (rnd() - .5) * 1.3 + (bx / W - .5) * 1.0;
    const arc = .38 + rnd() * .55;
    const steps = 24;
    let px = bx, py = by, prevx = bx, prevy = by;
    x.strokeStyle = 'rgba(38,64,38,.94)'; x.lineCap = 'round';
    for (let i = 1; i <= steps; i++) {
      const u = i / steps;
      const ang = -Math.PI / 2 + lean * u + arc * u * u;
      px += Math.cos(ang) * (reach / steps);
      py += Math.sin(ang) * (reach / steps);
      x.lineWidth = (1 - u) * 3.2 + .7;
      x.beginPath(); x.moveTo(prevx, prevy); x.lineTo(px, py); x.stroke();
      /* pinnae swell to the middle of the frond and shrink at both ends,
         which is the difference between a fern and a feather */
      const swell = Math.sin(Math.min(1, u * 1.12) * Math.PI);
      const len = swell * (reach * .22) + 3;
      if (len > 4) {
        for (const side of [-1, 1]) {
          x.save(); x.translate(px, py);
          x.rotate(ang + side * (1.00 + rnd() * .30) + (rnd() - .5) * .18);
          pinna(len, len * .40, rnd());
          x.restore();
        }
      }
      prevx = px; prevy = py;
    }
  }
  return c;
}

/* Stalks — the vertical, jointed kind that grows with its feet in water.
   Nothing else here is a straight line, which is the entire reason it is
   worth drawing: it gives the waterline an edge that the arcs and lobes
   cannot, and a few of them among the reeds is what stops the bank reading
   as one soft mass. */
function texStalks(seed, opt) {
  opt = opt || {};
  const W = opt.w || 512, H = opt.h || 768;
  const c = cvs(W, H), x = c.getContext('2d');
  const rnd = mulberry32(seed);
  const n = opt.stalks || 16;
  for (let i = 0; i < n; i++) {
    const bx = rnd() * W, by = H * (1.02 - rnd() * .03);
    const h = H * (.40 + rnd() * .55);
    const lean = (rnd() - .5) * W * .12;
    const wdt = 2.2 + rnd() * 3.6;
    const lit = rnd();
    const hi = 'rgb(' + Math.round(70 + lit * 96) + ',' + Math.round(134 + lit * 100) + ',' + Math.round(64 + lit * 52) + ')';
    const lo = 'rgb(' + Math.round(24 + lit * 26) + ',' + Math.round(60 + lit * 44) + ',' + Math.round(30 + lit * 22) + ')';
    const g = x.createLinearGradient(bx - wdt, 0, bx + wdt, 0);
    g.addColorStop(0, lo); g.addColorStop(.55, hi); g.addColorStop(1, lo);
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(bx - wdt, by);
    x.lineTo(bx + lean - wdt * .55, by - h);
    x.lineTo(bx + lean + wdt * .55, by - h);
    x.lineTo(bx + wdt, by);
    x.closePath(); x.fill();
    /* the joints, and the little whorl of needles at each one */
    const joints = 3 + (rnd() * 4 | 0);
    for (let j = 1; j <= joints; j++) {
      const t = j / (joints + 1);
      const jy = by - h * t, jx = bx + lean * t;
      x.strokeStyle = 'rgba(18,44,24,.75)';
      x.lineWidth = 1.2;
      x.beginPath(); x.moveTo(jx - wdt, jy); x.lineTo(jx + wdt, jy); x.stroke();
      if (rnd() < .7) {
        x.strokeStyle = hi; x.lineWidth = 1.1;
        for (let k = 0; k < 5; k++) {
          const a = -Math.PI / 2 + (k / 4 - .5) * 2.1;
          const nl = 6 + rnd() * 15;
          x.beginPath(); x.moveTo(jx, jy);
          x.lineTo(jx + Math.cos(a) * nl, jy + Math.sin(a) * nl * .7);
          x.stroke();
        }
      }
    }
  }
  return c;
}

/* Lily pads, seen from close and nearly flat on. The wedge notch is the whole
   silhouette — a disc without one is a coin — and the pale rim is what the
   lanterns catch across the water. */
function texLilyPads(seed, opt) {
  opt = opt || {};
  const W = opt.w || 640, H = opt.h || 640;
  const c = cvs(W, H), x = c.getContext('2d');
  const rnd = mulberry32(seed);
  const n = opt.pads || 9, S = Math.min(W, H);
  for (let i = 0; i < n; i++) {
    const r = S * ((opt.r || .10) + rnd() * .055);
    const px = r + rnd() * (W - r * 2), py = r + rnd() * (H - r * 2);
    const rot = rnd() * TAU, notch = .30 + rnd() * .40, lit = rnd();
    x.save(); x.translate(px, py); x.rotate(rot);
    const g = x.createRadialGradient(-r * .26, -r * .30, r * .08, 0, 0, r);
    g.addColorStop(0, 'rgb(' + Math.round(120 + lit * 74) + ',' + Math.round(190 + lit * 55) + ',' + Math.round(92 + lit * 52) + ')');
    g.addColorStop(.74, 'rgb(' + Math.round(58 + lit * 46) + ',' + Math.round(122 + lit * 50) + ',' + Math.round(56 + lit * 30) + ')');
    g.addColorStop(1, 'rgb(24,62,34)');
    x.fillStyle = g;
    x.beginPath(); x.moveTo(0, 0);
    x.arc(0, 0, r, notch, TAU + notch - .40);

    }
    x.strokeStyle = 'rgba(196,232,176,' + (.20 + lit * .26).toFixed(2) + ')';
    x.lineWidth = Math.max(1, r * .034);
    x.beginPath(); x.arc(0, 0, r * .96, notch, TAU + notch - .40); x.stroke();
    x.restore();

}

/* The forest behind everything: trunks going up out of frame into a canopy
   that is never resolved, because at this fog density it never would be. */
function texForest(seed) {
  const W = 1024, H = 1024, c = cvs(W, H), x = c.getContext('2d');
  const rnd = mulberry32(seed);
  /* canopy mass first, so the trunks read as being in front of it */
  for (let i = 0; i < 220; i++) {
    const cx2 = rnd() * W, cy = rnd() * H * .55, r = 22 + rnd() * 88;
    x.fillStyle = 'rgba(' + (10 + rnd() * 16 | 0) + ',' + (28 + rnd() * 30 | 0) + ',' + (26 + rnd() * 24 | 0) + ',' + (.16 + rnd() * .3).toFixed(2) + ')';
    x.beginPath(); x.ellipse(cx2, cy, r, r * (.5 + rnd() * .4), rnd() * TAU, 0, TAU); x.fill();
  }
  for (let i = 0; i < 26; i++) {
    const bx = rnd() * W, wdt = 5 + rnd() * 16, lean = (rnd() - .5) * 90;
    const top = H * (rnd() * .16);
    const g = x.createLinearGradient(bx - wdt, 0, bx + wdt, 0);
    g.addColorStop(0, 'rgba(6,14,17,.92)');
    g.addColorStop(.6, 'rgba(20,38,42,.92)');
    g.addColorStop(1, 'rgba(6,14,17,.92)');
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(bx - wdt, H); x.lineTo(bx + lean - wdt * .5, top);
    x.lineTo(bx + lean + wdt * .5, top); x.lineTo(bx + wdt, H);
    x.closePath(); x.fill();
  }

}

/* the warm interior, seen through glass: a lit room reduced to what actually
   survives a rainy pane at twenty metres — a bright floor wash, a warmer core,
   and two or three verticals that read as a doorway and a post */
function texInterior(seed) {
  const W = 512, H = 384, c = cvs(W, H), x = c.getContext('2d');
  const rnd = mulberry32(seed);
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4a2a12');
  g.addColorStop(.42, '#b4661f');
  g.addColorStop(.78, '#ffb257');
  g.addColorStop(1, '#ffd9a0');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const r = x.createRadialGradient(W * .62, H * .66, 8, W * .62, H * .66, W * .5);
  r.addColorStop(0, 'rgba(255,238,206,.95)');
  r.addColorStop(1, 'rgba(255,238,206,0)');
  x.fillStyle = r; x.fillRect(0, 0, W, H);
  /* the verticals. Dark, thin, and not evenly spaced — mullions and a door
     frame are the only interior detail that survives this far away */
  for (let i = 0; i < 5; i++) {
    const px = W * (.12 + rnd() * .78), wdt = 3 + rnd() * 9;
    x.fillStyle = 'rgba(28,16,8,' + (.30 + rnd() * .4).toFixed(2) + ')';
    x.fillRect(px, H * (rnd() * .2), wdt, H);
  }

  x.fillRect(0, H * .08, W, 5);

}

/* ============================================================== 2 · rock
   Displaced icosahedra with the moss painted into the vertex colours. Moss is
   a function of two things and the shader would need both anyway: how flat the
   surface is, because moss grows on tops and not on overhangs, and a noise
   field, because a clean line where moss starts is the tell that it was
   computed. Baking it into the colours costs one attribute and no material. */
const rockNoise = noise3(4021);
const grainNoise = noise3(7307);

/* Bump, without a bump map. The obvious route — draw a height field, convert
   it to a normal map, hang it on the material — needs uvs, and an icosahedron's
   are spherical with a seam running down it: a boulder with a visible zip is
   worse than a boulder with no texture. Triplanar sampling would fix that and
   costs a custom shader on every rock.

   The way out is that the displacement here is a *function*, not an image, so
   its gradient can simply be evaluated. Two extra samples in the tangent plane
   give the slope, and tilting the smooth ellipsoid normal by that slope is
   what a normal map does anyway. It also means the normal can carry detail
   finer than the mesh — the geometry gets two octaves, the normal gets four —
   which is the entire point of bump mapping and comes free here. */
function rockField(x, y, z, ox, oy, oz) {
  return rockNoise(x * .55 + ox, y * .55 + oy, z * .55 + oz) * .5
       + rockNoise(x * 1.9 + ox, y * 1.9 + oy, z * 1.9 + oz) * .18;
}
/* Amplitudes in metres, and bigger than they first were. At five centimetres
   over a metre and a half the relief was real and completely invisible — a
   boulder three metres across, lit by one weak key in fog, needs relief you
   could put a hand into before it reads as stone rather than as clay. */
function rockGrain(x, y, z, ox, oz) {
  return grainNoise(x * 3.0 + ox, y * 3.0, z * 3.0 + oz) * .130
       + grainNoise(x * 8.5 + ox, y * 8.5, z * 8.5 + oz) * .055
       + grainNoise(x * 21.0 + ox, y * 21.0, z * 21.0 + oz) * .020;
}
const _t1 = new THREE.Vector3(), _t2 = new THREE.Vector3(), _up = new THREE.Vector3();
const _pa = new THREE.Vector3(), _pb = new THREE.Vector3();

function makeBoulder(r, seed, opt) {
  opt = opt || {};
  const g = new THREE.IcosahedronGeometry(r, LOW ? 2 : 4);
  const pos = g.attributes.position;
  const rnd = mulberry32(seed);
  const ox = rnd() * 40, oy = rnd() * 40, oz = rnd() * 40;
  const sx = opt.sx || 1, sy = opt.sy === undefined ? .78 : opt.sy, sz = opt.sz || 1;
  const rough = opt.rough === undefined ? .30 : opt.rough;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    v.multiplyScalar(1 + rockField(v.x, v.y, v.z, ox, oy, oz) * rough);
    v.x *= sx; v.y *= sy; v.z *= sz;
    /* boulders sit in ground, they do not balance on it */
    if (v.y < -r * .34) v.y = -r * .34 - (v.y + r * .34) * .12;
    pos.setXYZ(i, v.x, v.y, v.z);
  }

  /* The normal: the ellipsoid's, tilted by the slope of a grain field that
     the mesh itself is far too coarse to carry. Sampling it either side in the
     tangent plane is a finite difference, and the step is deliberately about
     one vertex wide — smaller and it picks up noise the eye cannot resolve at
     any camera distance this scene allows. */
  const nor = new Float32Array(pos.count * 3);
  const nv = new THREE.Vector3();
  /* The step is in world units and fixed, not a fraction of the boulder. Scaled
     by r it straddled the grain's wavelength differently on every rock — wide
     enough on the big ones to alias the finest octave into streaks, which came
     back as smeared X-shaped highlights across the near stones. The grain is
     defined in world units too, so one step suits every size, and with the
     amplitudes read as metres the slope needs no gain on top: five centimetres
     of relief over a metre and a half is the tilt it should be. */
  const e = .06, k = (opt.bump === undefined ? 1 : opt.bump);
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    nv.set(v.x / (sx * sx), v.y / (sy * sy), v.z / (sz * sz)).normalize();
    _up.set(0, 1, 0);
    if (Math.abs(nv.y) > .92) _up.set(1, 0, 0);
    _t1.crossVectors(nv, _up).normalize();
    _t2.crossVectors(nv, _t1).normalize();
    const d0 = rockGrain(v.x, v.y, v.z, ox, oz);
    _pa.copy(v).addScaledVector(_t1, e);
    _pb.copy(v).addScaledVector(_t2, e);
    const g1 = (rockGrain(_pa.x, _pa.y, _pa.z, ox, oz) - d0) / e;
    const g2 = (rockGrain(_pb.x, _pb.y, _pb.z, ox, oz) - d0) / e;
    nv.addScaledVector(_t1, -g1 * k).addScaledVector(_t2, -g2 * k).normalize();
    nor[i * 3] = nv.x; nor[i * 3 + 1] = nv.y; nor[i * 3 + 2] = nv.z;
  }
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));

  const col = new Float32Array(pos.count * 3);
  const nrm = g.attributes.normal;
  const lo = new THREE.Color(PAL.rockLo), hi = new THREE.Color(PAL.rockHi);
  const mo = new THREE.Color(PAL.moss), mh = new THREE.Color(PAL.mossHi);
  const c = new THREE.Color();
  const wet = opt.moss === undefined ? 1 : opt.moss;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const up = nrm.getY(i);
    /* the bias was .42 with the lit terms on top of it, which put nearly every
       vertex at the light end of the ramp and made the ramp pointless */
    c.copy(lo).lerp(hi, clamp((v.y / (r * .9)) * .42 + .16 + up * .22, 0, 1));
    /* the grain, as tone as well as as shape — stone is mottled, and a bump
       with no colour variation under it reads as a wrinkled sheet */
    c.multiplyScalar(1 + rockGrain(v.x, v.y, v.z, ox, oz) * 1.6);
    const nz = rockNoise(v.x * .9 + ox * 2, v.y * .9, v.z * .9 + oz * 2) * .5 + .5;
    /* flatness times noise, with a soft edge: this is the whole moss rule */
    /* Half what it was. The tint used to be the only moss in the scene and had
       to carry it alone, which made the boulders green rather than mossy. The
       cushions do that job now and this is back to being what it should always
       have been — a stain under and around them, so the geometry has something
       to sit in instead of stopping on bare stone. */
    const m = clamp((up - .05) * 1.6, 0, 1) * clamp((nz - .30) * 2.8, 0, 1) * wet;
    if (m > 0) c.lerp(mo.clone().lerp(mh, nz), Math.pow(m, .62) * .52);
    /* Vertex colours are read as linear and the output is sRGB-encoded, so a
       swatch written straight in comes back a long way lighter than it was
       picked — 0x2f3d45 rendering as a pale sage is not the light being wrong,
       it is the same number read in two colour spaces. Convert once, here, and
       the palette above means what it says. */
    c.convertSRGBToLinear();
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}

/* ------------------------------------------------------------ moss cushions
   The reference's moss is not a tint on a rock, it is an object sitting on
   one: a bright chartreuse cushion with a soft edge, mounded up so it catches
   light on top and goes dark underneath. Painting that into the boulder's
   vertex colours — which is what this scene did until now — can only ever give
   a green rock, because a tint has no silhouette and the silhouette is most of
   what says "moss".

   So it gets geometry. A squashed sphere, displaced hard at high frequency so
   the outline is lumpy rather than round, lit from above by its own vertex
   colours as well as by the scene. Small, and in clusters: one big cushion is
   a green boulder, five overlapping small ones is moss. */
const mossNoise = noise3(1717);
function makeMossCushion(seed, r) {
  const g = new THREE.IcosahedronGeometry(r, LOW ? 2 : 3);
  const pos = g.attributes.position;
  const rnd = mulberry32(seed);
  const ox = rnd() * 30, oz = rnd() * 30;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = mossNoise(v.x * 2.6 + ox, v.y * 2.6, v.z * 2.6 + oz) * .30
            + mossNoise(v.x * 6.4 + ox, v.y * 6.4, v.z * 6.4 + oz) * .16;
    v.multiplyScalar(1 + n);
    v.y *= .46;                          /* a cushion, not a ball */
    if (v.y < -r * .18) v.y = -r * .18;  /* flat where it meets the stone */
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  /* Same trap as the boulders, same way out. IcosahedronGeometry shares no
     vertices, so computeVertexNormals can only give facets — and a faceted
     moss cushion reads as a heap of green crystals, which is a worse failure
     than the flat tint it replaced. The ellipsoid normal tilted by the slope
     of the same noise that shaped it is smooth *and* lumpy, which is what a
     cushion of moss actually is. */
  const nor = new Float32Array(pos.count * 3);
  const nv = new THREE.Vector3();
  const mossField = (x, y, z) => mossNoise(x * 2.6 + ox, y * 2.6, z * 2.6 + oz) * .30
                               + mossNoise(x * 6.4 + ox, y * 6.4, z * 6.4 + oz) * .16;
  const e = r * .06;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    nv.set(v.x, v.y / (.46 * .46), v.z).normalize();
    _up.set(0, 1, 0);
    if (Math.abs(nv.y) > .92) _up.set(1, 0, 0);
    _t1.crossVectors(nv, _up).normalize();
    _t2.crossVectors(nv, _t1).normalize();
    const d0 = mossField(v.x, v.y, v.z);
    _pa.copy(v).addScaledVector(_t1, e);
    _pb.copy(v).addScaledVector(_t2, e);
    nv.addScaledVector(_t1, -(mossField(_pa.x, _pa.y, _pa.z) - d0) / e * r * .8)
      .addScaledVector(_t2, -(mossField(_pb.x, _pb.y, _pb.z) - d0) / e * r * .8)
      .normalize();
    nor[i * 3] = nv.x; nor[i * 3 + 1] = nv.y; nor[i * 3 + 2] = nv.z;
  }
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));

  const col = new Float32Array(pos.count * 3);
  const nrm = g.attributes.normal;
  const deep = new THREE.Color(0x1d4a22), lit = new THREE.Color(0xa8d95c);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const up = clamp(nrm.getY(i) * .6 + (v.y / (r * .5)) * .5 + .35, 0, 1);
    c.copy(deep).lerp(lit, Math.pow(up, .8));
    /* speckle, because moss at this distance is thousands of separate shoots
       and a smooth gradient over it reads as painted foam */
    c.multiplyScalar(.82 + (mossNoise(v.x * 14, v.y * 14, v.z * 14) * .5 + .5) * .40);
    c.convertSRGBToLinear();
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}

/* the large shape belongs to the mesh; the grain belongs to the fragment.
   Keeping those scales separate avoids the faceted highlights produced by
   asking a few hundred vertices to carry a rock's entire surface. */
function stoneGrain() {
  if (WORLD.stoneGrain) return WORLD.stoneGrain;
  const c=cvs(256,256), x=c.getContext('2d'), im=x.createImageData(256,256);
  const rnd=mulberry32(9182), n=noise3(219);
  for(let y=0;y<256;y++) for(let u=0;u<256;u++) {
    const v=128+n(u*.09,y*.09,0)*32+n(u*.31,y*.31,2)*18+(rnd()-.5)*34;
    const i=(y*256+u)*4;
    im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;
  }
  x.putImageData(im,0,0);
  return WORLD.stoneGrain=tx(c,{srgb:false,wrap:THREE.RepeatWrapping,repeat:[2,2]});
}

/* a shared canopy pattern crosses stone and metal in world space. The
   reference's broken blue light is a property of the forest above them,
   rather than a different painted pattern on each object. */
function canopyLight(mat) {
  if(!WORLD.canopy) {
    const c=cvs(256,256), x=c.getContext('2d'), rnd=mulberry32(8291);
    x.fillStyle='#666';x.fillRect(0,0,256,256);x.filter='blur(2px)';
    for(let i=0;i<180;i++) {
      x.fillStyle=i%3?'#aaa':'#eee';
      x.beginPath();x.ellipse(rnd()*256,rnd()*256,2+rnd()*8,1+rnd()*3,rnd()*TAU,0,TAU);x.fill();
    }

  }
  mat.onBeforeCompile=shader=>{
    shader.uniforms.uCanopy={value:WORLD.canopy};
    shader.vertexShader='varying vec3 vGardenWorld;\n'+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       vec4 gardenP=vec4(transformed,1.);
       #ifdef USE_INSTANCING
         gardenP=instanceMatrix*gardenP;
       #endif
       vGardenWorld=(modelMatrix*gardenP).xyz;`);
    shader.fragmentShader='varying vec3 vGardenWorld; uniform sampler2D uCanopy;\n'+shader.fragmentShader;
    shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>',
      `#include <color_fragment>
       float canopy=texture2D(uCanopy,(vGardenWorld.xz+vGardenWorld.y*vec2(.35,.2))*.14).r;
       diffuseColor.rgb*=mix(.65,1.8,canopy);`);

const ROCK_MAT = () => canopyLight(new THREE.MeshStandardMaterial({
  vertexColors:true,roughness:.62,metalness:.04,flatShading:false,
  envMapIntensity:1.0,bumpMap:stoneGrain(),bumpScale:.085
}));

/* ============================================================= 3 · water
   The pool is a shader, not a mirror. A planar reflection here would cost a
   second render of the whole scene to buy something the reference does not
   actually show: look at it and the water is not reflecting the house, it is
   holding two long warm smears under the lanterns and a scatter of broken
   sky. So that is what this draws — the smears, some travelling ripple, and a
   depth ramp — for one pass and no render target.

   The smears are the picture. They are what tells you the surface is wet and
   flat and that the lights are above it, and they cost four lines. */
/* The fog is done by hand here rather than with `fog: true`. A ShaderMaterial
   that declares fog has to carry three.js's own fog uniforms and include its
   two fog chunks; declaring it without them throws inside refreshFogUniforms
   on every frame, which aborts the render *mid-pass* — so the water drew and
   nothing queued after it did. Half the garden was missing and the cause was
   in the sky, not in the plants. One uniform and two lines is cheaper than
   wiring the chunk system in for a single material. */
const WATER_VERT = `
  uniform mat4 uTexMat;
  varying vec2 vUv; varying vec3 vW; varying float vDepth; varying vec4 vRefl;
  void main(){
    vUv = uv;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vW = wp.xyz;
    /* where this point lands in the reflection pass, carried through as a
       projective coordinate so the divide happens per fragment */
    vRefl = uTexMat * wp;
    vec4 mv = viewMatrix * wp;
    vDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;
const WATER_FRAG = `
  precision highp float;
  uniform float uT; uniform vec3 uDeep; uniform vec3 uShallow;
  uniform vec3 uWarm; uniform vec3 uLampA; uniform vec3 uLampB;
  uniform vec3 uFog; uniform float uFogD;
  uniform sampler2D tRefl; uniform float uRefl;
  varying vec2 vUv; varying vec3 vW; varying float vDepth; varying vec4 vRefl;

  float wave(vec2 p, float t){
    return sin(p.x * 1.7 + t * .9) * .5
         + sin(p.y * 2.3 - t * 1.15) * .35
         + sin((p.x + p.y) * 3.1 + t * .62) * .22;
  }
  /* one lamp's reflection: a vertical smear that stretches away from the
     viewer and breaks up where the ripple is steepest, which is the only part
     of a reflection the eye actually checks */
  float smear(vec3 p, vec3 lamp, float t){
    float across = abs(p.x - lamp.x);
    float w = 0.30 + 0.16 * abs(sin(p.z * 1.9 + t * 1.4));
    float lat = exp(-across * across / (w * w * 4.0));
    /* toward the camera. The first version ran it the other way, off behind
       the lamp, where there is a rock in front of the water and nothing to
       see — a reflection lies between the light and the person looking. */
    float along = smoothstep(lamp.z - 1.5, lamp.z + 14.0, p.z);
    float chop = 0.55 + 0.45 * sin(p.z * 5.5 - t * 3.1 + across * 2.0);
    return lat * along * chop;
  }
  /* Rain on the surface. Three rings alive at once, each one a circle that
     grows and fades on its own clock — more than three and it reads as a
     pattern, fewer and the pond looks like it is under cover. */
  float rings(vec3 p, float t){
    float a = 0.0;
    for (int i = 0; i < 3; i++) {
      float fi = float(i);
      float cyc = t * 0.62 + fi * 0.37;
      float id  = floor(cyc);
      float age = fract(cyc);
      float h1 = fract(sin(id * 12.9898 + fi * 78.233) * 43758.5453);
      float h2 = fract(sin(id * 39.3468 + fi * 11.135) * 24634.6345);
      vec2 c = vec2(mix(-10.0, 10.0, h1), mix(-9.0, 8.0, h2));
      float r = age * 2.9;
      a += smoothstep(0.13, 0.0, abs(length(p.xz - c) - r)) * (1.0 - age) * (1.0 - age);
    }
    return a;
  }
  /* The glint. Two high frequencies beaten against each other and clipped hard
     at the top, which leaves a sparse scatter of single-pixel highlights that
     move — the thing wet surfaces do that no amount of specular on a smooth
     normal will give you, because a real one is a normal that is *not* smooth. */
  float glint(vec3 p, float t){
    float g = sin(p.x * 21.0 + t * 2.3) * sin(p.z * 17.0 - t * 1.9)
            * sin((p.x + p.z) * 9.0 + t * 1.1);
    /* Clipped hard. At 0.90 the whole pond twinkled evenly and read as snow
       falling on it — a glint is rare by definition, and an even scatter of
       them is a texture. */
    return smoothstep(0.972, 1.0, g);
  }
  void main(){
    float t = uT;
    float d = smoothstep(0.0, 26.0, -vW.z + 12.0);
    vec3 col = mix(uShallow, uDeep, d);
    float w = wave(vW.xz * 1.0, t);
    float rg = rings(vW, t);

    /* The reflection. Offset by the ripple slope and by the rings, which is
       what makes it read as a reflection *in water* rather than as a second
       picture printed on the pond — a mirror that does not wobble looks like
       glass, and glass in a garden looks like a mistake. */
    vec2 ruv = vRefl.xy / max(vRefl.w, 0.0001);
    ruv += vec2(w * 0.010, w * 0.006) + vec2(rg * 0.016, rg * 0.010);
    vec3 refl = texture2D(tRefl, clamp(ruv, vec2(0.002), vec2(0.998))).rgb;

    /* Fresnel. Water reflects almost nothing looked at straight down and
       almost everything at a grazing angle, and this camera is nearly at the
       surface — which is the whole reason the pool can carry the house. */
    vec3 vd = normalize(cameraPosition - vW);
    float fres = pow(1.0 - clamp(vd.y, 0.0, 1.0), 3.2);
    col = mix(col, refl, clamp(fres * uRefl, 0.0, 0.88));

    /* the sky, broken up: cold light lying on the ripple faces */
    col += vec3(0.06, 0.13, 0.15) * smoothstep(0.15, 0.95, w) * (1.0 - d * 0.5);
    col += uWarm * smear(vW, uLampA, t) * 0.85;
    col += uWarm * smear(vW, uLampB, t) * 0.62;
    /* a thin bright line where the ripple crests catch, near the camera only */
    float crest = smoothstep(0.86, 1.0, w) * (1.0 - d);
    col += vec3(0.20, 0.30, 0.28) * crest;
    col += vec3(0.42, 0.62, 0.60) * rg * (1.0 - d * 0.7);
    /* and only near a lamp. Water does not sparkle in the dark; the glint is
       a specular hit off a ripple face, so it needs something to be specular
       *of*, and the two lanterns are the only candidates in the frame. */
    float lit = max(exp(-length(vW.xz - uLampA.xz) * 0.17),
                    exp(-length(vW.xz - uLampB.xz) * 0.17));
    col += vec3(1.00, 0.94, 0.80) * glint(vW, t) * (1.0 - d) * lit * 2.4;

    float f = 1.0 - exp(-vDepth * vDepth * uFogD * uFogD);
    col = mix(col, uFog, clamp(f, 0.0, 1.0));
    gl_FragColor = vec4(col, 1.0);
  }`;

/* ========================================================== 3b · the mirror
   A planar reflection, for one plane only: the pond, which is flat and level
   at y = 0. That restriction is what keeps this to thirty lines instead of
   three hundred — the general case has to build the plane from the mesh every
   frame and skew the projection to clip at it; a fixed horizontal plane can
   just negate y.

   The camera below the water is the camera above it with its height, its
   look-at height and its up vector all flipped. Flipping `up` rather than
   scaling the matrix is what keeps the frame right-handed, so triangles still
   wind the way the renderer expects and nothing has to be told to draw its
   back faces.

   Everything under the surface is clipped away, because the shelf, the piers
   and the sunk half of every boulder are all down there and a reflection that
   shows them is a window, not a mirror. */
const MIRROR = { on: false };
function initMirror() {
  const s = LOW ? .5 : .75;
  MIRROR.target = new THREE.WebGLRenderTarget(
    Math.max(2, Math.floor(vpW() * s)), Math.max(2, Math.floor(vpH() * s)),
    { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, encoding: THREE.sRGBEncoding });
  MIRROR.cam = new THREE.PerspectiveCamera();
  MIRROR.scale = s;
  /* keep everything at or above the waterline; the plane's own two centimetres
     of slop stop the shoreline stones from strobing in and out at the edge */
  MIRROR.clip = new THREE.Plane(new THREE.Vector3(0, 1, 0), .02);
  MIRROR.texMat = new THREE.Matrix4();
  MIRROR.on = true;
}
const _look = new THREE.Vector3(), _fwd = new THREE.Vector3();
function renderMirror() {
  if (!MIRROR.on || !WORLD.waterMesh) return;
  const c = MIRROR.cam;
  c.copy(camera);
  c.position.set(camera.position.x, -camera.position.y, camera.position.z);
  camera.getWorldDirection(_fwd);
  _look.copy(camera.position).add(_fwd);
  c.up.set(0, -1, 0);
  c.lookAt(_look.x, -_look.y, _look.z);
  c.updateMatrixWorld(true);
  c.updateProjectionMatrix();

  /* world position -> reflection texture coordinate, as one matrix so the
     shader does a single transform and one divide */
  MIRROR.texMat.set(.5, 0, 0, .5,  0, .5, 0, .5,  0, 0, .5, .5,  0, 0, 0, 1);
  MIRROR.texMat.multiply(c.projectionMatrix);
  MIRROR.texMat.multiply(c.matrixWorldInverse);

  WORLD.waterMesh.visible = false;
  renderer.clippingPlanes = [MIRROR.clip];
  const old = renderer.getRenderTarget();
  renderer.setRenderTarget(MIRROR.target);
  renderer.clear();
  renderer.render(scene, c);
  renderer.setRenderTarget(old);
  renderer.clippingPlanes = [];
  WORLD.waterMesh.visible = true;
}

/* ==================================================== 3c · the environment
   There is no sky here to reflect and no cube to load, so one is drawn: a
   vertical gradient with a warm patch where the house is, run through the
   PMREM generator into a prefiltered environment. It is the cheapest
   specularity in the scene — every standard material picks it up from
   scene.environment with no per-material work — and it is what turns the wet
   stones from matte lumps into things with a sheen that moves as the camera
   drifts. */
function buildEnvironment() {
  const W = 512, H = 256, c = cvs(W, H), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1a22');
  g.addColorStop(.42, '#16343d');
  g.addColorStop(.55, '#20505c');
  g.addColorStop(.72, '#0d222a');
  g.addColorStop(1, '#050d11');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  /* the house, as the one warm thing anything can reflect */
  const warm = x.createRadialGradient(W * .5, H * .40, 4, W * .5, H * .40, W * .19);
  warm.addColorStop(0, 'rgba(255,186,110,.95)');
  warm.addColorStop(.45, 'rgba(196,116,52,.28)');
  warm.addColorStop(1, 'rgba(196,116,52,0)');
  x.fillStyle = warm; x.fillRect(0, 0, W, H);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.encoding = THREE.sRGBEncoding;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromEquirectangular(t).texture;
  pmrem.dispose();
  t.dispose();
}

/* =========================================================== 4 · the scene */
function initGL() {
  const canvasEl = document.getElementById('c');
  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: !LOW, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, LOW ? 1.4 : 2));
  renderer.setSize(vpW(), vpH(), false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .94;
  renderer.setClearColor(PAL.night, 1);

  scene = new THREE.Scene();
  /* Exponential, and heavy. The reference is mostly fog — it is what turns a
     dozen objects into a forest, and it is doing the job a hundred more trees
     would otherwise have to. */
  scene.fog = new THREE.FogExp2(PAL.fog, .034);

  camera = new THREE.PerspectiveCamera(42, vpW() / vpH(), .1, 220);
  camera.position.set(1.2, 3.5, 12.6);
  camera.lookAt(0, 4.4, -10);
}

function buildLights() {
  /* Moonlight, cold and weak, from behind and above the house. It is not there
     to light anything — it is there so the rocks have a direction. */
  const key = new THREE.DirectionalLight(0x9dd5e4, 1.25);
  key.position.set(-9, 16, -6);
  scene.add(key);
  /* bounce off the wet ground, which is what keeps the undersides from
     going to pure black in a scene with almost no fill */
  const hemi = new THREE.HemisphereLight(0x6499a3, 0x142622, .55);
  scene.add(hemi);
  /* barely any. Fill is what flattens a night, and the only reason there is
     any at all is that pure black holds no colour and this scene is about
     colour in the dark */
  scene.add(new THREE.AmbientLight(0x16323a, .16));
}

function addLantern(x, y, z, s) {
  const g = new THREE.Group();
  const dark = new THREE.MeshStandardMaterial({ color: 0x1a2228, roughness: .62, metalness: .35 });
  /* the post */
  const post = new THREE.Mesh(new THREE.CylinderGeometry(.035 * s, .045 * s, 1.5 * s, 8), dark);
  post.scale.y = .15; post.position.y = .12 * s; g.add(post);
  /* the box: four warm panes in a dark frame, plus a cap */
  const pane = new THREE.MeshBasicMaterial({ color: PAL.warmHi, fog: true, toneMapped: false });
  const box = new THREE.Mesh(new THREE.BoxGeometry(.34 * s, .40 * s, .34 * s), pane);
  box.position.y = .55 * s; g.add(box);
  /* the frame is four thin uprights rather than a transparent shell — a lantern
     is read by its bars, and a translucent box just looks like a glowing brick */
  [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([a, b]) => {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(.045 * s, .46 * s, .045 * s), dark);
    bar.position.set(a * .18 * s, .55 * s, b * .18 * s); g.add(bar);
  });
  const cap = new THREE.Mesh(new THREE.ConeGeometry(.34 * s, .20 * s, 4), dark);
  cap.position.y = .86 * s; cap.rotation.y = Math.PI / 4; g.add(cap);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(.46 * s, .04 * s, .46 * s), dark);
  lip.position.y = .75 * s; g.add(lip);

  for(const zSide of [-1,1]) {
    for(const xSide of [-.06,.06]) {
      const bar=new THREE.Mesh(new THREE.BoxGeometry(.018*s,.4*s,.025*s),dark);
      bar.position.set(xSide*s,.55*s,zSide*.18*s);g.add(bar);
    }
    for(const yLine of [.43,.64]) {
      const bar=new THREE.Mesh(new THREE.BoxGeometry(.36*s,.018*s,.025*s),dark);
      bar.position.set(0,yLine*s,zSide*.18*s);g.add(bar);
    }
  }
  const base=new THREE.Mesh(new THREE.BoxGeometry(.43*s,.06*s,.43*s),dark);
  base.position.y=.32*s;g.add(base);
  const lt = new THREE.PointLight(0xffb257, 1.7 * s, 6 * s, 2);
  lt.position.y = .55 * s; g.add(lt);

  /* the halo. Additive, always facing the camera, and the thing that sells a
     lamp in fog far more than the light itself does */
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(2.6 * s, 2.6 * s),
    new THREE.MeshBasicMaterial({ map: tx(texGlow('rgba(255,214,150,.85)', 'rgba(255,150,60,.30)')),
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: .78 }));
  halo.position.y = .55 * s; g.add(halo);
  WORLD.glows.push(halo);

  g.position.set(x, y, z);
  scene.add(g);
  WORLD.lanterns.push(new THREE.Vector3(x, y + .55 * s, z));
  return g;
}

/* broad glass and a dark return make the pavilion read as a room in the
   forest. The old solid box carried a small glowing picture on its face;
   recessing the room behind real panes gives the mullions depth. */
function buildHouse() {
  const g = new THREE.Group();
  const clad = canopyLight(new THREE.MeshStandardMaterial({ color:0x29424b,roughness:.36,metalness:.26 }));
  const dark = new THREE.MeshStandardMaterial({ color: 0x111e24, roughness: .44, metalness: .4 });
  const timber = new THREE.MeshStandardMaterial({ color: 0x725239, roughness: .8,
    emissive: 0x75451d, emissiveIntensity: .22 });
  const box = (w,h,d,x,y,z,mat) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z); g.add(m); return m;
  };
  const w=9.6, h=5.2, d=5.0;
  box(w+.6,.38,d+.8,0,h+.16,0,clad);
  box(w+1.0,.46,d+1.4,0,-.18,.25,clad);
  box(w,.16,d,0,.13,0,timber);
  box(w,.13,d,0,h-.12,0,timber);
  box(.28,h,d,w/2-.14,h/2,0,clad);
  box(.2,h,d,-w/2+.1,h/2,0,dark);
  box(w,h,.18,0,h/2,-d/2,timber);
  /* most of the room stays cool. Warm light is concentrated in the doorway,
     so the glass can still carry the forest instead of turning orange. */
  const roomTex = tx(texInterior(31));
  const room = new THREE.Mesh(new THREE.PlaneGeometry(w*.44,h*.88),
    new THREE.MeshBasicMaterial({map:roomTex,color:0xa89973,fog:true}));
  room.position.set(w*.22,h*.47,-d/2+.12); g.add(room);
  for(let i=0;i<16;i++) box(.035,h*.87,.06,w*.02+i*.26,h*.47,-d/2+.2,timber);
  box(1.8,.14,.85,-1.0,1.1,.0,timber);
  box(.08,1,.08,-1.7,.58,.0,dark); box(.08,1,.08,-.3,.58,.0,dark);
  const glass = new THREE.MeshPhysicalMaterial({color:0x527782,metalness:.28,
    roughness:.12,transparent:true,opacity:.27,depthWrite:false,
    clearcoat:1,clearcoatRoughness:.08,envMapIntensity:1.4,side:THREE.DoubleSide});
  for(let i=0;i<5;i++) {
    const x=-w/2+.18+(i+.5)*(w-.36)/5;
    const pane=new THREE.Mesh(new THREE.PlaneGeometry((w-.36)/5-.07,h-.42),glass);
    pane.position.set(x,h/2,d/2+.01);g.add(pane);
    box(.075,h-.2,.11,x-(w-.36)/10,h/2,d/2+.04,dark);
  }
  box(.10,h,.12,w/2-.19,h/2,d/2+.03,dark);
  box(w,.10,.12,0,.25,d/2+.03,dark);
  box(w,.10,.12,0,h-.23,d/2+.03,dark);
  /* seams on the solid return are quiet, but establish the scale of the
     panels in the same way the mullions establish the scale of the glass. */
  for(let y=1.25;y<h;y+=1.25) box(.012,.018,d-.05,w/2+.006,y,0,dark);
  box(w*.55,3.8,d*.55,.7,-2.2,-.5,dark);
  g.position.set(1.3,5.0,-12.4); g.rotation.y=-.34; scene.add(g);
  const roomLight=new THREE.PointLight(0xffbf78,2.8,12,2);
  roomLight.position.set(2.7,7.0,-10.7);scene.add(roomLight);
  const under=new THREE.PointLight(0xffc082,.65,6,2);
  under.position.set(1.6,4.5,-9.3);scene.add(under);
  return g;
}

function buildTerrain() {
  const rnd = mulberry32(9091);
  const mat = ROCK_MAT();

  /* The shelf the house stands on, and the wall of boulders under it. Sizes
     are deliberately uneven and a few are half-buried: a slope of same-sized
     rocks reads as gravel however big you make them. */
  const shelf = [
    [-6.2, 2.1, -8.0, 3.7, 8811], [-3.4, .7, -10.6, 2.5, 8822],
    [-7.4, 5.3, -16.0, 3.4, 8833], [ 6.6, 1.5, -12.4, 3.0, 8844],
    [ 9.8, 2.9, -16.5, 4.4, 8855], [ 3.2, .5, -9.4, 1.9, 8866],
    [-5.6, 3.4, -18.5, 4.6, 8877], [ 5.4, 3.8, -19.5, 4.2, 8888],
    [ 0.4, 4.4, -22.5, 5.2, 8899], [-11.5, 4.0, -21.0, 4.8, 8910]
  ];
  shelf.forEach(([x, y, z, r, sd]) => {
    const m = new THREE.Mesh(makeBoulder(r, sd, { sy: .62 + (sd % 7) * .03, moss: .9 }), mat);
    m.position.set(x, y, z);
    m.rotation.y = (sd % 11) * .3;
    scene.add(m);
  });

  /* the near stones, in and beside the water. Almost no moss on these — they
     are wet, and a wet stone reads by being dark and shiny, not by being
     green. */
  /* Wet stone is a dark stone with a bright reflection on it, not a light
     stone. Low roughness against a real environment is what does that; before
     there was an environment it just made them matte and slightly paler. */
  /* .17 gave every foreground stone one perfectly round highlight, which is
     what a billiard ball looks like, not a wet rock. A real one is smooth at
     the scale of the shape and rough at the scale of the highlight, and with
     no bump map to say so the only lever is to spread the specular until it
     stops being a disc. */
  const wetMat = canopyLight(new THREE.MeshStandardMaterial({ vertexColors:true,roughness:.28,
    metalness:.06,envMapIntensity:1.25,bumpMap:stoneGrain(),bumpScale:.055 }));
  const near = [
    [-4.6, .10, 3.2, 1.5, 9011, .18], [ 4.9, .05, 2.6, 1.7, 9022, .12],
    [-2.4, -.05, 5.6, 1.1, 9033, .05], [ 2.6, -.10, 6.4, 1.3, 9044, .05],
    [-5.6, .95, -1.4, 2.7, 9055, .65], [ 6.8, .65, -2.2, 2.8, 9066, .60],
    [ 0.2, -.18, 7.6, 1.0, 9077, .02], [-8.2, .55, -4.2, 2.6, 9088, .55],
    [ 8.4, .60, -4.8, 2.5, 9099, .52]
  ];
  near.forEach(([x, y, z, r, sd, ms]) => {
    const m = new THREE.Mesh(makeBoulder(r, sd, { sy: .52, moss: ms }), wetMat);
    m.position.set(x, y, z);
    m.rotation.y = (sd % 13) * .27;
    scene.add(m);
  });

  /* Pebbles along the waterline, as one instanced mesh. Forty of them at a
     draw call each would be forty draw calls for something nobody looks
     directly at; instanced, the whole shore costs one. They share a geometry,
     so the variation has to come from scale and rotation — which for a pebble
     is enough, because a pebble has no features to repeat. */
  const pebGeo = makeBoulder(1, 9600, { sy: .44, rough: .34, moss: .12 });
  const pebbles = new THREE.InstancedMesh(pebGeo, wetMat, 46);
  const mtx = new THREE.Matrix4(), qt = new THREE.Quaternion();
  const eu = new THREE.Euler(), sc = new THREE.Vector3(), ps = new THREE.Vector3();
  for (let i = 0; i < 46; i++) {
    const side = rnd() < .5 ? -1 : 1;
    const t = rnd();
    const sz = .16 + Math.pow(rnd(), 2) * .5;
    ps.set(side * (2.2 + t * 9.5) + (rnd() - .5) * 1.6,
           -sz * .30 + rnd() * .06,
           6.5 - rnd() * 11);
    eu.set(rnd() * .6 - .3, rnd() * TAU, rnd() * .6 - .3);
    qt.setFromEuler(eu);
    sc.set(sz * (.8 + rnd() * .6), sz, sz * (.8 + rnd() * .6));
    mtx.compose(ps, qt, sc);
    pebbles.setMatrixAt(i, mtx);
  }
  pebbles.instanceMatrix.needsUpdate = true;
  scene.add(pebbles);

  /* the low stone step the water runs over, right of centre and opposite the
     house so the two do not share an axis */
  const ledge = new THREE.Mesh(makeBoulder(3.2, 9500, { sy: .34, sx: 2.1, rough: .16, moss: .5 }), mat);
  ledge.position.set(.5, .34, -4.4);
  scene.add(ledge);

  /* Cushions, in clusters, on the tops the moss tint already picked out. Three
     shapes shared between them, with the variation carried by scale and
     rotation — a cushion has no features to repeat, so that is enough. They
     sit slightly *into* the rock rather than on it, because moss grows out of
     a surface and a cushion balanced on top reads as a hat. */
  const mossMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .96,
    metalness: 0, envMapIntensity: .35 });
  const cushions = [makeMossCushion(2201, 1), makeMossCushion(2202, 1), makeMossCushion(2203, 1)];
  const clumps = [
    /* on the shelf */
    [-6.2, 4.3, -8.0, 2.3], [-7.4, 7.4, -16.0, 2.2], [ 6.6, 3.3, -12.4, 2.0],
    [ 9.8, 6.0, -16.5, 2.7], [-5.6, 6.6, -18.5, 2.8], [ 5.4, 7.0, -19.5, 2.5],
    [-3.4, 2.0, -10.6, 1.7], [ 3.2, 1.4, -9.4, 1.4],
    /* and on the near stones, where the camera can actually see the texture */
    [-5.6, 2.3, -1.4, 1.9], [ 6.8, 2.0, -2.2, 1.8],
    [-8.2, 1.9, -4.2, 1.9], [ 8.4, 2.0, -4.8, 1.8],
    [ 2.0, 1.32, -4.4, 1.6]
  ];
  clumps.forEach(([cx, cy, cz, spread], ci) => {
    const n = 4 + (rnd() * 4 | 0);
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(cushions[(ci + i) % 3], mossMat);
      const sz = spread * (.20 + Math.pow(rnd(), 1.6) * .34);
      const a = rnd() * TAU, rad = Math.pow(rnd(), .6) * spread * .8;
      m.position.set(cx + Math.cos(a) * rad, cy - sz * .30 + rnd() * .12,
                     cz + Math.sin(a) * rad * .8);
      m.scale.set(sz * (.9 + rnd() * .5), sz * (.7 + rnd() * .5), sz * (.9 + rnd() * .5));
      m.rotation.y = rnd() * TAU;
      m.rotation.z = (rnd() - .5) * .3;
      scene.add(m);
    }
  });
}

function buildWater() {
  const geo = new THREE.PlaneGeometry(60, 52, 1, 1);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uT: T,
      uDeep:    { value: new THREE.Color(0x081b22) },
      uShallow: { value: new THREE.Color(0x16404a) },
      uWarm:    { value: new THREE.Color(0xff9a3c) },
      uLampA:   { value: WORLD.lanterns[0].clone() },
      uLampB:   { value: WORLD.lanterns[1].clone() },
      uFog:     { value: new THREE.Color(PAL.fog) },
      uFogD:    { value: .034 },
      tRefl:    { value: MIRROR.target ? MIRROR.target.texture : null },
      uRefl:    { value: MIRROR.on ? 1.15 : 0 },
      uTexMat:  { value: MIRROR.texMat || new THREE.Matrix4() }
    },
    vertexShader: WATER_VERT, fragmentShader: WATER_FRAG
  });
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(0, 0, -4);
  m.renderOrder = 1;
  scene.add(m);
  WORLD.water = mat;
  WORLD.waterMesh = m;

  buildCascade();

  /* One raft, bottom right, close enough to the lens to have detail in it.
     Three even patches read as pond dressing; a raft gathered against one
     bank reads as pads, because that is what pads do. */
  const padSpec = [
    [ 3.8, 7.2, 8.4, 5.6, 6101], [ 6.4, 3.6, 6.4, 4.6, 6202],
    [ 0.8, 8.6, 5.2, 3.8, 6303], [-4.2, 8.0, 4.0, 3.0, 6404]
  ];
  padSpec.forEach(([x, z, w, l, sd]) => {
    const t = texLilyPads(sd, { w: 640, h: Math.round(640 * l / w), pads: 8, r: .085 });
    const m2 = new THREE.Mesh(new THREE.PlaneGeometry(w, l),
      new THREE.MeshBasicMaterial({ map: tx(t, { aniso: 16 }), transparent: true,
        alphaTest: .05, depthWrite: false, fog: true, color: 0xa9c98f }));
    m2.rotation.x = -Math.PI / 2;
    m2.position.set(x, .045, z);
    m2.renderOrder = 3;
    scene.add(m2);
  });
}

function buildCascade() {
  const geo=new THREE.PlaneGeometry(3.1,1,48,20), p=geo.attributes.position;
  for(let i=0;i<p.count;i++) {
    const u=p.getX(i)/3.1+.5, v=p.getY(i)+.5;
    const bend=Math.pow(v,.42);
    p.setXYZ(i, .45+(u-.5)*3.1, .04+v*.91,
      -.80-bend*.85 + Math.sin(u*13)*.045);
  }
  geo.computeVertexNormals();
  const mat=new THREE.ShaderMaterial({uniforms:{uT:T},transparent:true,
    depthWrite:false,side:THREE.DoubleSide,
    vertexShader:`varying vec2 vUv;
      void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform float uT;varying vec2 vUv;
      void main(){
        float x=vUv.x, y=vUv.y;
        float thread=sin(x*135.+sin(y*4.-uT*1.4)*.6)*.5+.5;
        float fine=pow(thread,7.);
        float broad=sin(x*27.+.4)*.5+.5;
        float edge=smoothstep(0.,.06,x)*(1.-smoothstep(.92,1.,x));
        float flow=.74+.26*sin(y*31.+uT*4.5+x*8.);
        float a=edge*(.12+fine*.42+pow(broad,5.)*.20)*flow;
        vec3 col=mix(vec3(.12,.35,.40),vec3(.65,.90,.90),fine*.6+pow(1.-y,5.)*.4);
        gl_FragColor=vec4(col,a);
      }`});
  scene.add(new THREE.Mesh(geo,mat));
  /* the landing is broken foam, narrow enough that the dark pool still
     separates the fall from its own reflection. */
  const foam=cvs(512,128), x=foam.getContext('2d'), rnd=mulberry32(7441);
  for(let i=0;i<450;i++) {
    const px=rnd()*512, py=64+(rnd()-.5)*60*Math.sin(px/512*Math.PI);
    x.fillStyle='rgba(174,224,218,'+(.08+rnd()*.36)+')';
    x.beginPath();x.ellipse(px,py,1+rnd()*9,.4+rnd()*1.4,0,0,TAU);x.fill();
  }
  const f=new THREE.Mesh(new THREE.PlaneGeometry(3.8,.68),
    new THREE.MeshBasicMaterial({map:tx(foam),transparent:true,depthWrite:false,opacity:.62}));
  f.rotation.x=-Math.PI/2;f.position.set(.45,.035,-.65);scene.add(f);
}

function cutout(canvasEl, tint, alphaTest) {
  feather(canvasEl, { x: .07, y: .09 });
  return new THREE.MeshBasicMaterial({
    map: tx(canvasEl, { aniso: 16 }), transparent: true,
    alphaTest: alphaTest === undefined ? .04 : alphaTest,
    depthWrite: true, side: THREE.DoubleSide, fog: true,
    color: tint === undefined ? 0xffffff : tint
  });
}

function buildPlanting() {
  const rnd = mulberry32(5150);
  /* Four families, not one shape at four sizes. Which one goes where is the
     part that matters: ferns want the damp shade at the foot of the rocks,
     stalks want their feet actually in the water, blades want the shoreline,
     and the broadleaf bush wants the open bank where the light gets in. Put
     them anywhere and the bank reads as a texture; put them where they grow
     and it reads as a place that has plants in it. */
  const bushes = [texLeafBush(2101, { stems: 9 }), texLeafBush(2202, { stems: 7 }),
                  texLeafBush(2303, { stems: 11 })].map(c => cutout(c, 0x9fc79a));
  const wiry   = [texLeafBush(2404, { stems: 22, leaf: .30 }),
                  texLeafBush(2505, { stems: 26, leaf: .26 })].map(c => cutout(c, 0xa8cf9c));
  const ferns  = [texFern(4101, { fronds: 8 }), texFern(4202, { fronds: 6 })]
                  .map(c => cutout(c, 0x8fbf92));
  const blades = [texBlades(3101, { blades: 52 }), texBlades(3202, { blades: 38 })]
                  .map(c => cutout(c, 0x8fbc8a));
  const stalks = [texStalks(5101, { stalks: 16 }), texStalks(5202, { stalks: 12 })]
                  .map(c => cutout(c, 0x93c185));

  const put = (mats, x, y, z, w, h, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h, 4, 4), mats[i % mats.length]);
    m.position.set(x, y + h * .44, z);
    m.scale.x = rnd() < .5 ? -1 : 1;
    m.renderOrder = 4;
    scene.add(m);
    return m;
  };

  let k = 0;
  /* The left bank is the heavy one, and it is mostly rock — the reference
     stacks its boulders on that side and lets the planting fill in around
     them, which is why the two sides do not mirror. */
  for (let i = 0; i < 13; i++) {
    const t = i / 12;
    const sz = 2.1 + rnd() * 2.7;
    put(bushes, -7.2 - t * 7.0 - rnd() * 1.5, .2 + t * 2.6, 3.0 - t * 13.5, sz, sz * .86, k++);
  }
  for (let i = 0; i < 8; i++) {
    const t = i / 7;
    const sz = 1.7 + rnd() * 1.7;
    put(ferns, -5.4 - t * 6.0 - rnd() * 1.8, .1 + t * 2.0, 1.2 - t * 10.5, sz, sz * .82, k++);
  }
  /* the right bank carries more of the green, and it is the side the stream
     comes down, so it gets the wet-footed things */
  for (let i = 0; i < 15; i++) {
    const t = i / 14;
    const sz = 2.0 + rnd() * 2.8;
    put(bushes, 6.2 + t * 8.0 + rnd() * 1.8, .2 + t * 2.4, 2.2 - t * 13.5, sz, sz * .86, k++);
  }
  for (let i = 0; i < 9; i++) {
    const t = i / 8;
    const sz = 1.8 + rnd() * 1.9;
    put(ferns, 4.8 + t * 6.4 + rnd() * 1.6, .1 + t * 1.9, .6 - t * 10.0, sz, sz * .82, k++);
  }
  /* the middle distance, behind the ledge */
  for (let i = 0; i < 10; i++) {
    const sz = 1.5 + rnd() * 1.8;
    put(i % 3 ? bushes : ferns, (rnd() - .5) * 15, .5 + rnd() * 1.5,
        -7.0 - rnd() * 5.5, sz, sz * .86, k++);
  }
  /* The wiry small-leaved shrub, high and wide — it is the thing filling the
     top corners of the reference and it wants to be up among the rocks rather
     than down at the water, which is also the one part of the frame that had
     nothing in it but stone. */
  for (let i = 0; i < 14; i++) {
    const sx = rnd() < .5 ? -1 : 1;
    const t = rnd();
    const sz = 2.4 + rnd() * 3.4;
    put(wiry, sx * (7.0 + t * 8.0) + (rnd() - .5) * 2.4,
        1.6 + t * 4.2 + rnd() * 1.2, -6.0 - t * 12.0, sz, sz * .92, k++);
  }
  /* and a few small ones tucked against the near stones, where the cushions
     are, so the moss has something growing out of it */
  for (let i = 0; i < 9; i++) {
    const sx = rnd() < .5 ? -1 : 1;
    const sz = 1.0 + rnd() * 1.1;
    put(wiry, sx * (4.6 + rnd() * 4.5), .5 + rnd() * 1.1, -1.0 - rnd() * 6.0,
        sz, sz * .92, k++);
  }
  /* the waterline. Blades read as reeds because of where they are, not what
     they are; the stalks are the vertical among them. */
  /* Both of these are edge planting, and both had grown across the middle —
     twenty reeds and eleven stalks at |x| from 2.6 out was a hedge standing
     between the lens and the water. Held out past four metres, they frame the
     pond instead of fencing it. */
  for (let i = 0; i < 16; i++) {
    const sx = rnd() < .5 ? -1 : 1;
    const sz = 1.0 + rnd() * 1.3;
    put(blades, sx * (4.4 + rnd() * 5.6), -.05, 4.6 - rnd() * 9.5, sz, sz * 1.25, k++);
  }
  for (let i = 0; i < 8; i++) {
    const sx = rnd() < .38 ? -1 : 1;
    const sz = .9 + rnd() * 1.1;
    put(stalks, sx * (5.4 + rnd() * 5.0), -.10, 3.4 - rnd() * 8.0, sz, sz * 1.5, k++);
  }
}

function buildBackdrop() {
  const rnd=mulberry32(7119);
  const bark=new THREE.MeshStandardMaterial({color:0x172d32,roughness:.95});
  for(let i=0;i<26;i++) {
    const x=(rnd()-.5)*48, z=-23-rnd()*24, height=19+rnd()*15;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12+rnd()*.25,.3+rnd()*.48,height,7),bark);
    trunk.position.set(x,height/2-1,z);trunk.rotation.z=(rnd()-.5)*.10;scene.add(trunk);
  }
  /* the forest, as three sheets at three depths. Nearer ones are lighter, not
     darker, because they have more air behind them and less in front */
  const fTex = [texForest(1201), texForest(1302), texForest(1403)]
    .map(c => feather(c, { x: .16, y: .22, bottom: true }));
  [[0, 12, -46, 96, 52, 0x557c82],
   [-16, 10, -34, 62, 38, 0x668b8c],
   [ 20, 10, -32, 58, 36, 0x668b8c]].forEach((r, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(r[3], r[4]),
      new THREE.MeshBasicMaterial({ map: tx(fTex[i % 3]), transparent: true,
        color: r[5], depthWrite: false, fog: false }));
    m.position.set(r[0], r[1], r[2]);
    m.renderOrder = 0;
    scene.add(m);
  });
  /* and the mist that separates them, which is doing as much work as the
     trees are */
  const mistTex = tx(texGlow('rgba(150,190,196,.30)', 'rgba(96,140,152,.10)'));
  for (let i = 0; i < (LOW ? 3 : 6); i++) {
    const rnd = mulberry32(400 + i);
    const s = 16 + rnd() * 22;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s * .5),
      new THREE.MeshBasicMaterial({ map: mistTex, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
        opacity: .05 + rnd() * .07 }));
    m.position.set((rnd() - .5) * 40, 2 + rnd() * 9, -18 - rnd() * 22);
    m.renderOrder = 2;
    scene.add(m);
  }
}

/* rain, and the fireflies that make the rain read as warm rather than cold */
function buildWeather() {
  if (!LOW) {
    const N = 1400;
    const pos = new Float32Array(N * 3), seed = new Float32Array(N);
    const rnd = mulberry32(3311);
    for (let i = 0; i < N; i++) {
      pos[i * 3] = (rnd() - .5) * 46;
      pos[i * 3 + 1] = rnd() * 22;
      pos[i * 3 + 2] = -30 + rnd() * 44;
      seed[i] = rnd();
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    const rain = new THREE.Points(g, new THREE.ShaderMaterial({
      uniforms: { uT: T, uSize: { value: vpH() * .5 } },
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      vertexShader:
        'attribute float aSeed; uniform float uT; uniform float uSize; varying float vA;\n' +
        'void main(){ vec3 p = position;\n' +
        ' p.y = mod(p.y - uT * (7.0 + aSeed * 5.0), 22.0);\n' +
        ' p.x += sin(uT * .3 + aSeed * 30.0) * .3;\n' +
        ' vec4 mv = modelViewMatrix * vec4(p, 1.0);\n' +
        ' vA = (.10 + aSeed * .26) * smoothstep(0.0, 4.0, p.y);\n' +
        ' gl_PointSize = uSize * (.0016 + aSeed * .0022) / max(-mv.z, .5);\n' +
        ' gl_Position = projectionMatrix * mv; }',
      fragmentShader:
        'varying float vA;\n' +
        'void main(){ vec2 d = gl_PointCoord - .5;\n' +
        ' if (dot(d, d) > .25) discard;\n' +
        ' gl_FragColor = vec4(vec3(.72, .86, .90), vA); }'
    }));
    rain.frustumCulled = false; rain.renderOrder = 6;
    scene.add(rain);
  }

  const FN = LOW ? 40 : 105;
  const pos = new Float32Array(FN * 3), seed = new Float32Array(FN);
  const rnd = mulberry32(6612);
  for (let i = 0; i < FN; i++) {
    /* clustered where the planting is, because a firefly over open water is a
       dot with nothing to be near */
    const side = rnd() < .5 ? -1 : 1;
    pos[i * 3] = side * (2.5 + Math.pow(rnd(), .7) * 11);
    pos[i * 3 + 1] = .4 + Math.pow(rnd(), 1.5) * 4.4;
    pos[i * 3 + 2] = 6 - rnd() * 20;
    seed[i] = rnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const fly = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { uT: T, uSize: { value: vpH() * .5 },
      uTex: { value: tx(texGlow('rgba(255,238,172,1)', 'rgba(255,176,74,.32)')) } },
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader:
      'attribute float aSeed; uniform float uT; uniform float uSize; varying float vA;\n' +
      'void main(){ vec3 p = position; float s = aSeed * 63.0;\n' +
      ' p.x += sin(uT * (.17 + aSeed * .19) + s) * 1.2;\n' +
      ' p.y += sin(uT * (.13 + aSeed * .14) + s * 1.7) * .55;\n' +
      ' p.z += cos(uT * (.15 + aSeed * .17) + s * 2.3) * 1.0;\n' +
      ' vec4 mv = modelViewMatrix * vec4(p, 1.0);\n' +
      ' float b = sin(uT * (.52 + aSeed * .80) + s * 3.1) * .5 + .5;\n' +
      ' vA = pow(b, 2.8) * (.55 + aSeed * .45);\n' +
      ' gl_PointSize = uSize * (.020 + aSeed * .026) / max(-mv.z, .6);\n' +
      ' gl_Position = projectionMatrix * mv; }',
    fragmentShader:
      'uniform sampler2D uTex; varying float vA;\n' +
      'void main(){ if (vA <= .004) discard;\n' +
      ' vec4 t = texture2D(uTex, gl_PointCoord);\n' +
      ' gl_FragColor = vec4(t.rgb * vec3(1.60, 1.10, .42), t.a * vA * 1.30); }'
  }));
  fly.frustumCulled = false; fly.renderOrder = 7;
  scene.add(fly);
}

/* ============================================================ 5 · the loop */
const CAM = { mx: 0, my: 0, tmx: 0, tmy: 0 };
let running = true, last = performance.now(), clock = 0;

function resize() {
  W = vpW(); H = vpH();
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  /* On a tall phone the composition loses its sides, which is where the whole
     garden is. Step the lens back and open it rather than letting the banks
     fall off the edges. */
  const narrow = clamp((1.5 - W / H) / .9, 0, 1);
  camera.fov = 43 + narrow * 8;
  camera.updateProjectionMatrix();
  scene.traverse(o => {
    if (o.isPoints && o.material.uniforms && o.material.uniforms.uSize)
      o.material.uniforms.uSize.value = H * renderer.getPixelRatio() * .5;
  });
  if (MIRROR.on) MIRROR.target.setSize(Math.max(2, Math.floor(W * MIRROR.scale)),
                                       Math.max(2, Math.floor(H * MIRROR.scale)));
}

function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, .05); last = now;
  clock += REDUCE ? 0 : dt;
  T.value = clock;

  /* halos face the lens */
  WORLD.glows.forEach(h => h.quaternion.copy(camera.quaternion));

  /* A slow breath plus the pointer. The camera never travels — this is one
     composition, and moving through it would mean building the parts of the
     garden that are only implied. */
  CAM.mx += (CAM.tmx - CAM.mx) * Math.min(1, dt * 2.2);
  CAM.my += (CAM.tmy - CAM.my) * Math.min(1, dt * 2.2);
  const t = clock;
  /* Height and aim both came back after the recompose. Tipped up to put the
     house in the top third, the pond fell off the bottom of the frame — and
     the pond is where the reflections, the pads and half the light are. The
     water wants the lower forty per cent, which means looking *along* it
     rather than over it. */
  camera.position.set(
    1.2 + Math.sin(t * .13) * .10 + CAM.mx * .28,
    3.5 + Math.sin(t * .09) * .06 + CAM.my * .12,
    12.6 + Math.max(0, 1.0 - W/H) * 8.0
  );
  camera.lookAt(-CAM.mx * .12, 4.4 - CAM.my * .10, -10);
  camera.updateMatrixWorld(true);

  renderMirror();
  renderer.render(scene, camera);
}

function boot() {
  try {
    initGL();
  } catch (e) {
    document.getElementById('pre').innerHTML = '<i>this scene needs WebGL</i>';
    return;
  }
  buildLights();
  buildEnvironment();
  initMirror();
  buildBackdrop();
  buildTerrain();
  buildHouse();
  addLantern(-3.8, .50, -1.7, 1.9);
  addLantern(2.7, 1.5, -7.0, 1.45);
  buildWater();
  buildPlanting();
  buildWeather();
  resize();
  addEventListener('resize', resize);
  addEventListener('pointermove', e => {
    CAM.tmx = (e.clientX / innerWidth - .5) * 2;
    CAM.tmy = (e.clientY / innerHeight - .5) * 2;
  }, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { running = false; }
    else if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
  requestAnimationFrame(frame);
  /* a timeout, not a second rAF: a tab that loads in the background never gets
     the frame, and the visitor comes back to a page that says it is still
     growing the garden over a garden that finished */
  setTimeout(() => document.getElementById('pre').classList.add('gone'), 80);
}
boot();
})();
</script>
