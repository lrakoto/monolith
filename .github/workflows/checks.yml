# The page has no runtime tests and a broken index.html fails silently — the
# preloader just never finishes. These are the two checks worth having, run on
# every push so they do not depend on whoever is editing remembering to.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # test_page.py shells out to `node --check` on the inline script; without
      # node that test skips itself and the page goes unchecked.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - run: python3 -B -m unittest discover -p 'test_*.py' -v
