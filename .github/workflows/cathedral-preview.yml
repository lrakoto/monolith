# manual preview deployment for the earlier browser cathedral experiment.
# pushing this branch also archives offline blender studies and must not deploy them.
# the ftp destination remains scoped to the separate portfolio-c folder.
name: cathedral-preview

on:
  workflow_dispatch:          # any ref, from the Actions tab

# Shared with deploy.yml on purpose. Two FTP sessions into the same account at
# once is how a half-uploaded index.html happens, and the account is the same
# whichever folder the job is writing to.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A preview is still a public URL. Same gate as the live deploy.
      - name: Test before publishing
        run: python3 -B -m unittest discover -p 'test_*.py' -v

      # Only this workflow does this, which is the point: the live page shares
      # index.html with the preview, so a meta noindex in the document would
      # take /portfolio/ out of the index too. The header comes from outside
      # the document instead, and only this folder gets the file.
      - name: Keep the preview out of search results
        run: cp preview/htaccess .htaccess

      - name: Upload to threeohfivestudios.com/portfolio-c
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /threeohfivestudios.com/portfolio-c/
          # Identical to deploy.yml. FONT-LICENSES.md is deliberately not
          # excluded — the embedded faces are licensed on the condition that
          # attribution travels with them, so it ships with every copy of the
          # page, preview included.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.py
            **/*.blend
            **/*.blend1
            tools/**
            renders/**
            BLENDER_HANDOFF.md
            **/__pycache__/**
            **/.DS_Store
            README.md
            AGENTS.md
            CLAUDE.md
            DEPLOY.md
            preview/**
            root/**
            worker/**

      # Same skip-rather-than-fail shape as deploy.yml, and for the same
      # reason: the secrets context is not allowed in a step-level `if:` and
      # GitHub rejects the whole file for using it there.
      - name: Purge Cloudflare
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "No Cloudflare secrets set — skipping purge. The upload succeeded;"
            echo "the cache will age out on its own, or purge it by hand."
            exit 0
          fi
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["threeohfivestudios.com/portfolio-c/"]}' \
            | tee /dev/stderr | grep -q '"success":true'
