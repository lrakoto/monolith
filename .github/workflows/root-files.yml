# The files that have to sit at the domain root rather than in /portfolio/.
#
# llms.txt is only looked for at the root of a host. This page is a folder
# inside a WordPress site, so deploy.yml cannot put it there: its server-dir is
# the portfolio folder, and one level up from that is the WordPress document
# root.
#
# Which is the whole reason this is curl and not the deploy action.
# FTP-Deploy-Action mirrors a directory — it deletes remote files that are not
# in the local one — and the directory it would be mirroring here is the
# WordPress install. curl puts one named file and has no opinion about anything
# else in the folder, so the worst case is a file that lands wrong rather than a
# site that is gone.
#
# Manual dispatch only, for the same reason. Nothing at the document root should
# move because someone pushed a commit.
#
# The path is relative to wherever the FTP account lands, which for the account
# in use (hermes@pixelmix.co) is /home/<user>/public_html — so the domain root
# is threeohfivestudios.com/ with no public_html in front of it. See DEPLOY.md;
# that table is the thing to check if the credentials ever change.
name: root-files

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put llms.txt at the domain root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # --ssl-reqd is explicit FTPS, the same protocol deploy.yml asks for.
          # No --ftp-create-dirs on purpose: if the path is ever wrong, failing
          # is the right outcome, not building a stray tree on the host.
          curl --fail --show-error --silent \
               --ssl-reqd \
               --user "$FTP_USERNAME:$FTP_PASSWORD" \
               --upload-file root/llms.txt \
               "ftp://$FTP_SERVER/threeohfivestudios.com/llms.txt"

      - name: Confirm the host is serving it
        run: |
          # Cloudflare sits in front, so give it a few tries before believing a
          # miss. Only a non-200 fails the job — a body that differs is worth
          # printing but is usually the cache still catching up, and a workflow
          # that goes red for a host having a bad minute gets ignored.
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/live.txt -w '%{http_code}' \
                   https://threeohfivestudios.com/llms.txt || echo 000)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "GET /llms.txt -> $code"
          [ "$code" = "200" ]
          if diff -q root/llms.txt /tmp/live.txt >/dev/null; then
            echo "served copy matches the file in the repo"
          else
            echo "served copy differs from the repo — probably the edge cache:"
            diff root/llms.txt /tmp/live.txt || true
          fi
