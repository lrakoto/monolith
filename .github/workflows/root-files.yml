name: root-files
on:
  workflow_dispatch:
jobs:
  remove-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the portfolio homepage redirect
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import ftplib, io, os, re, ssl, hashlib
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect(os.environ['FTP_SERVER'])
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          path='threeohfivestudios.com/.htaccess'
          def read(path):
              out=io.BytesIO();ftp.retrbinary('RETR '+path,out.write);return out.getvalue()
          before=read(path)
          pattern=rb'(?m)^# BEGIN Portfolio redirect[^\r\n]*\r?\n.*?^# END Portfolio redirect[^\r\n]*(?:\r?\n|$)'
          blocks=list(re.finditer(pattern,before,re.S))
          if len(blocks)!=1: raise RuntimeError('Expected exactly one dedicated portfolio redirect block; no changes made')
          block=blocks[0]
          if b'RewriteRule ^$ /portfolio/ [R=302,L]' not in block.group(): raise RuntimeError('Unexpected redirect contents; no changes made')
          after=before[:block.start()]+before[block.end():]
          if b'# BEGIN WordPress' not in after: raise RuntimeError('WordPress block missing; no changes made')
          backup='threeohfivestudios.com/.htaccess.before-portfolio-removal-20260923'
          ftp.storbinary('STOR '+backup,io.BytesIO(before))
          if read(backup)!=before: raise RuntimeError('Backup verification failed; original unchanged')
          if read(path)!=before: raise RuntimeError('File changed during backup; stopping')
          ftp.storbinary('STOR '+path,io.BytesIO(after))
          if read(path)!=after:
              ftp.storbinary('STOR '+path,io.BytesIO(before))
              raise RuntimeError('Upload verification failed; original restored')
          ftp.quit()
          print('Removed portfolio redirect only. Backup verified. New SHA256:',hashlib.sha256(after).hexdigest())
          PYCODE
