name: root-files
on:
  workflow_dispatch:
jobs:
  update-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace approved resume with verified backup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import ftplib, io, os, ssl, hashlib
          from pathlib import Path
          after=Path('root/Lova_Resume_2026.pdf').read_bytes()
          if not after.startswith(b'%PDF-'): raise RuntimeError('Invalid replacement PDF')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          ftp.connect(os.environ['FTP_SERVER'])
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          path='threeohfivestudios.com/wp-content/uploads/2026/03/Lova_Resume_2026.pdf'
          def read(path):
              out=io.BytesIO();ftp.retrbinary('RETR '+path,out.write);return out.getvalue()
          before=read(path)
          if not before.startswith(b'%PDF-'): raise RuntimeError('Existing file is not a PDF')
          if before!=after:
              backup=path.replace('.pdf','.before-20260923.pdf')
              ftp.storbinary('STOR '+backup,io.BytesIO(before))
              if read(backup)!=before: raise RuntimeError('Backup verification failed; original unchanged')
              if read(path)!=before: raise RuntimeError('File changed during backup; stopping')
              try:
                  ftp.storbinary('STOR '+path,io.BytesIO(after))
                  if read(path)!=after: raise RuntimeError('Upload verification failed')
              except Exception:
                  ftp.storbinary('STOR '+path,io.BytesIO(before))
                  raise
          ftp.quit()
          print('Live resume verified. SHA256:',hashlib.sha256(after).hexdigest())
          PYCODE
      - name: Purge resume cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          url='https://api.cloudflare.com/client/v4/zones/'+os.environ['CF_ZONE_ID']+'/purge_cache'
          body=json.dumps({'files':['https://threeohfivestudios.com/wp-content/uploads/2026/03/Lova_Resume_2026.pdf']}).encode()
          request=urllib.request.Request(url,data=body,headers={'Authorization':'Bearer '+os.environ['CF_API_TOKEN'],'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              result=json.load(response)
          if not result.get('success'): raise RuntimeError('Cache purge failed')
          print('Resume cache purged')
          PYCODE
